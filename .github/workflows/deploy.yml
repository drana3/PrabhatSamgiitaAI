name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install Node deps
        run: npm ci

      - name: Sync API deps
        working-directory: apps/api
        run: uv sync --frozen --extra dev

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build web
        run: npm run build

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://prabhatai-web.bluemeadow-9418d5fc.centralindia.azurecontainerapps.io
    env:
      RG: prabhatai-rg
      LOCATION: centralindia
      PREFIX: prabhatai
      ACR_NAME: prabhataiacr30800
      ACA_ENV: prabhatai-env
      PG_SERVER: prabhatai-pg
      PG_DB: prabhatai
      WEB_APP: prabhatai-web
      API_APP: prabhatai-api
      LAW: prabhatai-law
      PG_ADMIN: codexadmin
      BUDGET_NAME: dewasheesh
      BUDGET_AMOUNT: "2000"
      BUDGET_EMAIL: dewasheesh.rana3@gmail.com
      ARM_USE_OIDC: "true"
      TF_IN_AUTOMATION: "true"
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Apply Azure budget
        working-directory: infra/terraform/budget
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false
        env:
          TF_VAR_budget_name: ${{ env.BUDGET_NAME }}
          TF_VAR_amount: ${{ env.BUDGET_AMOUNT }}
          TF_VAR_notification_email: ${{ env.BUDGET_EMAIL }}
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy app stack
        env:
          PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
        run: bash ./infra/azure/deploy-app.sh
