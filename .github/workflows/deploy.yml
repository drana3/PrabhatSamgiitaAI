name: Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      # Docs and mobile-only pushes should not burn a full verify/E2E/Azure cycle.
      - "docs/**"
      - "**.md"
      - "apps/mobile/**"
      - ".github/workflows/mobile-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_AUTH_ENABLED: "true"
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install Node deps
        run: npm ci

      - name: Sync API deps
        working-directory: apps/api
        run: uv sync --frozen --extra dev

      - name: Lint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_AUTH_ENABLED: "true"
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install Node deps
        run: npm ci

      - name: Sync API deps
        working-directory: apps/api
        run: uv sync --frozen --extra dev

      - name: Test
        run: npm run test

      - name: Validate backend user questions
        run: apps/api/.venv/bin/python scripts/validate_backend_acceptance.py

  build:
    name: Build web
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_AUTH_ENABLED: "true"
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node deps
        run: npm ci

      - name: Build web
        run: npm run build:e2e

      - name: Upload web build for journey tests
        uses: actions/upload-artifact@v4
        with:
          name: web-next-build
          # .next is hidden, so it is dropped unless hidden files are opted in.
          include-hidden-files: true
          path: |
            apps/web/.next
            !apps/web/.next/cache
            apps/web/public
          retention-days: 1

  e2e:
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, mobile-chromium]
    env:
      NEXT_PUBLIC_AUTH_ENABLED: "true"
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install Node deps
        run: npm ci

      - name: Sync API deps
        working-directory: apps/api
        run: uv sync --frozen --extra dev

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-next-build
          path: apps/web

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('apps/web/package.json', 'package-lock.json') }}

      - name: Install browser for premium journey tests
        # System packages are only needed on a cold cache; browsers themselves
        # restore from the cache key above.
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi
        working-directory: apps/web

      - name: Validate premium journeys
        run: npm --workspace apps/web run test:e2e -- --project=${{ matrix.project }}

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: [lint, test, build, e2e]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://prabhatai-web.bluemeadow-9418d5fc.centralindia.azurecontainerapps.io
    env:
      RG: prabhatai-rg
      LOCATION: centralindia
      PREFIX: prabhatai
      ACR_NAME: prabhataiacr30800
      ACA_ENV: prabhatai-env
      PG_SERVER: prabhatai-pg
      PG_DB: prabhatai
      WEB_APP: prabhatai-web
      API_APP: prabhatai-api
      PG_ADMIN: codexadmin
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy app stack
        env:
          PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_CHAT_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_CHAT_DEPLOYMENT }}
          AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
        run: bash ./infra/azure/deploy-app.sh
