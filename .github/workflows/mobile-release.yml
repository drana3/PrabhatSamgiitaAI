name: Mobile release build

# EAS: https://expo.dev/accounts/dewasheesh3s-team/projects/prabhatsamgiitaai
# Project ID: 7cbd8dae-da81-4236-a7c2-c9c707540afe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-release
  cancel-in-progress: true

jobs:
  test:
    name: Mobile unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Run unit tests
        working-directory: apps/mobile
        run: npm test

  build:
    name: ${{ matrix.label }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            profile: production
            label: Android AAB (Play Store)
            artifact_name: prabhat-samgiita-ai-android-release
            output_file: prabhat-samgiita-ai-release.aab
          - platform: ios
            profile: production
            label: iOS IPA (App Store / TestFlight)
            artifact_name: prabhat-samgiita-ai-ios-release
            output_file: prabhat-samgiita-ai-release.ipa

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Set up EAS CLI
        run: npm install -g eas-cli@latest

      - name: Verify Expo credentials
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: "7cbd8dae-da81-4236-a7c2-c9c707540afe"
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add EXPO_TOKEN to GitHub repository secrets. See .github/MOBILE_BUILD_SETUP.md"
            exit 1
          fi
          eas whoami
          INFO="$(eas project:info --json 2>/dev/null || eas project:info)"
          echo "$INFO"
          echo "$INFO" | grep -q "dewasheesh3s-team" || {
            echo "::error::EAS project must belong to dewasheesh3s-team. Check apps/mobile/app.json owner + projectId."
            exit 1
          }

      - name: Validate EAS project config
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: "7cbd8dae-da81-4236-a7c2-c9c707540afe"
        run: npx expo config --type public > /dev/null

      - name: Verify mobile OAuth secrets
        env:
          MOBILE_AZURE_CLIENT_ID: ${{ secrets.MOBILE_AZURE_CLIENT_ID }}
          MOBILE_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.MOBILE_GOOGLE_ANDROID_CLIENT_ID }}
          MOBILE_GOOGLE_IOS_CLIENT_ID: ${{ secrets.MOBILE_GOOGLE_IOS_CLIENT_ID }}
          MOBILE_MEMBER_PROXY_KEY: ${{ secrets.MOBILE_MEMBER_PROXY_KEY }}
        run: bash ./scripts/verify-mobile-build-secrets.sh

      - name: Sync member proxy to EAS production environment
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MOBILE_MEMBER_PROXY_KEY: ${{ secrets.MOBILE_MEMBER_PROXY_KEY }}
        run: bash ../../scripts/sync-mobile-eas-env.sh production

      - name: Build with EAS
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: "7cbd8dae-da81-4236-a7c2-c9c707540afe"
        run: |
          set -a
          [ -n "${{ secrets.MOBILE_API_BASE_URL }}" ] && export EXPO_PUBLIC_API_BASE_URL="${{ secrets.MOBILE_API_BASE_URL }}"
          [ -n "${{ secrets.MOBILE_WEB_BASE_URL }}" ] && export EXPO_PUBLIC_WEB_BASE_URL="${{ secrets.MOBILE_WEB_BASE_URL }}"
          [ -n "${{ secrets.MOBILE_MEMBER_PROXY_KEY }}" ] && export EXPO_PUBLIC_MEMBER_PROXY_KEY="${{ secrets.MOBILE_MEMBER_PROXY_KEY }}"
          [ -n "${{ secrets.MOBILE_AZURE_CLIENT_ID }}" ] && export EXPO_PUBLIC_AZURE_CLIENT_ID="${{ secrets.MOBILE_AZURE_CLIENT_ID }}"
          [ -n "${{ secrets.MOBILE_AZURE_TENANT_ID }}" ] && export EXPO_PUBLIC_AZURE_TENANT_ID="${{ secrets.MOBILE_AZURE_TENANT_ID }}"
          [ -n "${{ secrets.MOBILE_GOOGLE_IOS_CLIENT_ID }}" ] && export EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID="${{ secrets.MOBILE_GOOGLE_IOS_CLIENT_ID }}"
          [ -n "${{ secrets.MOBILE_GOOGLE_ANDROID_CLIENT_ID }}" ] && export EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID="${{ secrets.MOBILE_GOOGLE_ANDROID_CLIENT_ID }}"
          set +a
          eas build \
            --platform "${{ matrix.platform }}" \
            --profile "${{ matrix.profile }}" \
            --non-interactive \
            --wait

      - name: Resolve download URL
        id: artifact
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: "7cbd8dae-da81-4236-a7c2-c9c707540afe"
        run: |
          URL="$(eas build:list --platform "${{ matrix.platform }}" --limit 1 --json --non-interactive | node -e "
            const rows = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const build = rows[0];
            const url = build?.artifacts?.buildUrl || build?.artifacts?.applicationArchiveUrl;
            if (!url) process.exit(1);
            process.stdout.write(url);
          ")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Download URL: $URL"

      - name: Download build artifact
        working-directory: apps/mobile
        run: curl --fail --location --output "${{ matrix.output_file }}" "${{ steps.artifact.outputs.url }}"

      - name: Upload installable build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: apps/mobile/${{ matrix.output_file }}
          retention-days: 90

  summary:
    name: Release instructions
    runs-on: ubuntu-latest
    needs: build
    if: always() && needs.build.result == 'success'
    steps:
      - name: Publish release instructions
        run: |
          {
            echo "## Mobile release builds"
            echo ""
            echo "EAS project: [dewasheesh3s-team / prabhatsamgiitaai](https://expo.dev/accounts/dewasheesh3s-team/projects/prabhatsamgiitaai)"
            echo ""
            echo "### Android"
            echo "Download **prabhat-samgiita-ai-android-release** (\`.aab\`) and upload to Google Play Console."
            echo ""
            echo "### iOS"
            echo "Download **prabhat-samgiita-ai-ios-release** (\`.ipa\`) or submit from the Expo dashboard to TestFlight."
            echo ""
            echo "Submit from your machine:"
            echo "\`cd apps/mobile && eas submit --platform all --profile production\`"
          } >> "$GITHUB_STEP_SUMMARY"
