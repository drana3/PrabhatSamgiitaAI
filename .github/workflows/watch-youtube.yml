name: Watch trusted Prabhat Samgiita channels

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: watch-prabhat-youtube
  cancel-in-progress: false

jobs:
  sync:
    name: Sync channel inventory
    runs-on: ubuntu-latest
    steps:
      - name: Check out workflow ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip uv
          cd apps/api
          uv sync --frozen --extra dev

      - name: Scan configured YouTube channels into Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Set GitHub secret DATABASE_URL to the Neon pooled postgresql+psycopg URL."
            exit 1
          fi
          apps/api/.venv/bin/python scripts/sync_youtube.py --general-search-limit 0

      - name: Validate media inventory
        run: |
          apps/api/.venv/bin/python scripts/validate_data.py
          cd apps/api
          .venv/bin/pytest -q tests/test_youtube_sync.py tests/test_full_catalog.py

      - name: Commit inventory changes
        id: changes
        run: |
          if git diff --quiet -- data/generated/youtube_videos.json data/generated/youtube_review_queue.json data/generated/youtube_search_state.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "prabhat-media-bot"
          git config user.email "prabhat-media-bot@users.noreply.github.com"
          git add data/generated/youtube_videos.json data/generated/youtube_review_queue.json data/generated/youtube_search_state.json
          git commit -m "chore: sync AMPS YouTube catalog"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy updated catalog
        if: steps.changes.outputs.changed == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref ${{ github.event.repository.default_branch }}
