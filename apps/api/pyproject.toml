[project]
name = "prabhat-samgiita-ai-api"
version = "0.1.0"
description = "FastAPI backend for Prabhat Samgiita AI"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "alembic>=1.13.2",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "psycopg[binary,pool]>=3.2.1",
  "pgvector>=0.3.6",
  "httpx>=0.27.0",
  "apscheduler>=3.10.4",
  "structlog>=24.4.0",
  "python-dateutil>=2.9.0.post0",
  "python-multipart>=0.0.9",
  "beautifulsoup4>=4.12.3",
  "Unidecode>=1.3.8",
  "bcrypt>=4.2.0",
  "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.8",
  "anyio>=4.4.0",
  "ruff>=0.5.7",
  "mypy>=1.11.1",
  "types-python-dateutil>=2.9.0.20240316",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
plugins = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
