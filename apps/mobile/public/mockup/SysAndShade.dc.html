<style>
body{margin:0}
.app{--forest:#20281A;--sage-700:#3C5535;--orange:#F67931;--gold:#F5C253;--sand:#EEE9E5;--sage:#DDE3D0;
  --ease:cubic-bezier(.2,.7,.2,1);
  position:relative;width:390px;height:844px;overflow:hidden;box-sizing:border-box;background:var(--forest);color:#fff;
  font-family:'Roboto',sans-serif;font-size:16px;line-height:1.3;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
.app *{box-sizing:border-box}
:where(.app) button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent;position:relative}
.app button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app svg{display:block;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ico{width:24px;height:24px}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.psi{width:24px;height:24px;border-radius:23%;overflow:hidden;stroke:none}
.art{display:block;position:relative;overflow:hidden;flex:none;width:56px;height:56px;border-radius:12px;background:var(--forest)}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 6%;transform:scale(1.6);transform-origin:62% 14%}
.glass{background:linear-gradient(rgba(32,40,26,.4),rgba(32,40,26,.4)),rgba(255,255,255,.18);-webkit-backdrop-filter:blur(24px) saturate(1.5);backdrop-filter:blur(24px) saturate(1.5);border:1px solid rgba(255,255,255,.35)}
.press{transition:transform 160ms var(--ease),opacity 160ms var(--ease)}
.press:active{transform:scale(.9);opacity:.8;transition-duration:0ms}
.pp{width:64px;height:64px;border-radius:50%;display:block}
.pp .ico{position:absolute;left:50%;top:50%;width:32px;height:32px;margin:-16px 0 0 -16px;transition:transform 200ms var(--ease),opacity 200ms var(--ease)}
.pp .ip-play{opacity:0;transform:scale(.6)}
.paused .pp .ip-pause{opacity:0;transform:scale(.6)}
.paused .pp .ip-play{opacity:1;transform:scale(1)}
.sk{width:56px;height:56px;border-radius:50%;display:block}
.sk .ico{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px}
.wv{display:flex;align-items:center;gap:3px;height:24px}
.wv i{display:block;width:3px;height:100%;border-radius:2px;background:var(--gold);transform:scaleY(.3);animation:wv 380ms ease-in-out infinite alternate}
.wv i:nth-child(2){animation-duration:310ms;animation-delay:-120ms}
.wv i:nth-child(3){animation-duration:400ms;animation-delay:-220ms}
.wv i:nth-child(4){animation-duration:340ms;animation-delay:-60ms}
.wv i:nth-child(5){animation-duration:290ms;animation-delay:-180ms}
@keyframes wv{to{transform:scaleY(1)}}
.paused .wv i{animation-play-state:paused;transform:scaleY(.25)}
.bar{position:relative;height:5px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden;flex:1}
.bar i{position:absolute;inset:0;transform-origin:0 50%;transform:scaleX(.27);background:#fff;border-radius:3px}
.tm{font-size:12px;font-weight:500;color:rgba(255,255,255,.7);font-variant-numeric:tabular-nums;letter-spacing:.2px;min-width:34px}
.tm.rt{text-align:right}
/* status bar */
.sb{position:absolute;left:0;right:0;top:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 34px 0 38px;font-weight:700;font-size:16px;z-index:5}
.sb .g{display:flex;align-items:center;gap:6px}
.di{position:absolute;left:50%;top:11px;width:124px;height:36px;margin-left:-62px;border-radius:18px;background:#000;z-index:6}
.homebar{position:absolute;left:50%;bottom:8px;width:136px;height:5px;margin-left:-68px;border-radius:3px;background:#fff;z-index:9;opacity:.95}

.app.and{background:#20281A}

.navpill{position:absolute;left:50%;bottom:9px;width:112px;height:4px;margin-left:-56px;border-radius:2px;background:#fff;opacity:.9;z-index:9}

.mc-h .art{width:64px;height:64px;border-radius:18px}
.mc-h .meta .t{font-size:18px;line-height:24px;font-weight:700}
.mc-h .meta .s{font-size:14px;line-height:20px;color:rgba(255,255,255,.78)}
.mc-app{align-self:flex-start;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:rgba(255,255,255,.72);letter-spacing:.2px}
.mc-app .psi{width:16px;height:16px}
.wavebar{position:relative;height:22px;margin-top:12px}
.wavebar .tr1{position:absolute;left:0;right:0;top:10px;height:3px;border-radius:2px;background:rgba(255,255,255,.3)}
.wavebar .pl{position:absolute;left:0;top:0;height:22px;width:34%;overflow:hidden}
.wavebar .pl svg{position:absolute;left:0;top:0;width:520px;height:22px;stroke:var(--gold);stroke-width:3;transform-origin:0 50%;transform:scaleY(1);transition:transform 250ms var(--ease)}
.wavebar .pl .wave-w{position:absolute;left:0;top:0;width:520px;height:22px;animation:wvx 1.2s linear infinite}
.wavebar .dot{position:absolute;left:34%;top:3px;width:4px;height:16px;margin-left:-1px;border-radius:2px;background:var(--gold)}
@keyframes wvx{to{transform:translateX(-24px)}}
.paused .wavebar .pl svg{transform:scaleY(0)}
.paused .wave-w{animation-play-state:paused}
.times{display:flex;justify-content:space-between;margin-top:2px}

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
  componentDidMount() {
    /* Press feedback fires on pointerdown. Keyboard activation (click with detail 0) is handled too. */
    const run = (b) => {
      const a = b.getAttribute('data-act');
      const root = b.closest('.app');
      if (!root) return;
      if (a === 'pp') {
        const paused = root.classList.toggle('paused');
        root.querySelectorAll('[data-act="pp"]').forEach((x) => x.setAttribute('aria-label', paused ? 'Play' : 'Pause'));
      } else if (a === 'tog') {
        b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
      } else if (a === 'en') {
        const on = b.getAttribute('aria-pressed') !== 'true';
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
        root.classList.toggle('no-tr', !on);
      } else if (a === 'chords') {
        const on = b.getAttribute('aria-pressed') !== 'true';
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
        const l = b.querySelector('.lbl');
        if (l) l.textContent = on ? 'Chords on' : 'Chords off';
        root.classList.toggle('chords-on', on);
      } else if (a === 'fold') {
        root.classList.toggle('folded');
      }
    };
    this._pd = (e) => { const b = e.target.closest && e.target.closest('[data-act]'); if (b) { this._skip = true; run(b); } };
    this._ck = (e) => { const b = e.target.closest && e.target.closest('[data-act]'); if (!b) return; if (this._skip) { this._skip = false; return; } run(b); };
    document.addEventListener('pointerdown', this._pd);
    document.addEventListener('click', this._ck);
  }
  componentWillUnmount() {
    document.removeEventListener('pointerdown', this._pd);
    document.removeEventListener('click', this._ck);
  }
}
</script>
