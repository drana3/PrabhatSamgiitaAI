.app{--forest:#20281A;--sage-700:#3C5535;--orange:#F67931;--gold:#F5C253;--sand:#EEE9E5;--sage:#DDE3D0;

.pp{width:64px;height:64px;border-radius:50%;display:block}

.wv i:nth-child(4){animation-duration:340ms;animation-delay:-60ms}
.wv i:nth-child(5){animation-duration:290ms;animation-delay:-180ms}
@keyframes wv{to{transform:scaleY(1)}}
.paused .wv i{animation-play-state:paused;transform:scaleY(.25)}
.bar{position:relative;height:5px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden;flex:1}
.bar i{position:absolute;inset:0;transform-origin:0 50%;transform:scaleX(.27);background:#fff;border-radius:3px}

class Component extends DCLogic {
  renderVals() { return {}; }
  componentDidMount() {
    /* Press feedback fires on pointerdown. Keyboard activation (click with detail 0) is handled too. */
    const run = (b) => {
      const a = b.getAttribute('data-act');
      const root = b.closest('.app');
      if (!root) return;
      if (a === 'pp') {
        const paused = root.classList.toggle('paused');
        root.querySelectorAll('[data-act="pp"]').forEach((x) => x.setAttribute('aria-label', paused ? 'Play' : 'Pause'));
      } else if (a === 'tog') {
        b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
      } else if (a === 'en') {
        const on = b.getAttribute('aria-pressed') !== 'true';
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
        root.classList.toggle('no-tr', !on);
      } else if (a === 'chords') {
        const on = b.getAttribute('aria-pressed') !== 'true';
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
        const l = b.querySelector('.lbl');
        if (l) l.textContent = on ? 'Chords on' : 'Chords off';
        root.classList.toggle('chords-on', on);
      } else if (a === 'fold') {
        root.classList.toggle('folded');
      }
    };
    this._pd = (e) => { const b = e.target.closest && e.target.closest('[data-act]'); if (b) { this._skip = true; run(b); } };
    this._ck = (e) => { const b = e.target.closest && e.target.closest('[data-act]'); if (!b) return; if (this._skip) { this._skip = false; return; } run(b); };
    document.addEventListener('pointerdown', this._pd);
    document.addEventListener('click', this._ck);
  }
  componentWillUnmount() {
    document.removeEventListener('pointerdown', this._pd);
    document.removeEventListener('click', this._ck);
  }
}
</script>
</body>
