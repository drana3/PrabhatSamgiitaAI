services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: prabhatai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prabhatai"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/prabhatai
      APP_ENV: development
      API_CORS_ORIGINS: http://localhost:3000
      CONTENT_SOURCE_URL: https://prabhatasamgiita.net
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
